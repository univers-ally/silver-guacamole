summary: |-
  Pick free items on the promo page, then earn "stars" by placing orders that meet the page's minimum spend. Once you have enough stars for an item, it ships free with that order.

  • Picked items can't be changed.
  • Stars are a percentage of the items' listed price, excluding tax, shipping and other charges. Some orders earn a higher rate, up to a cap.
  • Your picked free items must already be in the order when you place it.
  • Your first order may also get a coupon bundle worth up to 100% of its value, capped at $100. Thresholds and values show on the page; expiry only after you receive the coupons.
  • A refund that drops an order below the minimum, or leaves too few stars for an item you redeemed, cancels that item. If it already shipped, you may be charged its full price.
reward: 'Earn stars by ordering, "trade" them for free stuff (seen: 5 gifts up to $385). First order also gets coupons, max $100'
