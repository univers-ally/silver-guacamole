summary: |-
  Pick items from the page's pool; they can't be changed afterwards. Each qualifying order from the promo page that meets the minimum takes $1 off your picks for every $1 spent, starting with the cheapest pick.

  • Your first qualifying order is required before you can buy the first pick.
  • The discount the first order puts toward your second pick is capped; anything over the cap rolls to the third and fourth.
  • Each later order adds a capped amount. The full discount needs the total spend shown on the page.
  • Refunding the qualifying items from the first or second order, or from an order containing the third or fourth pick, so that only the discounted picks are left, cancels that order and ends your part in the promo.
  • If refunds drop your total qualifying spend below 70% of the milestone, orders containing the third or fourth pick are cancelled. Other partial refunds shrink or take back the discounts.
reward: Pick items, then spend on other stuff from the page to slash their prices, up to 99% off
