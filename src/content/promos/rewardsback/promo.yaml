summary: |-
  Order from the promo page over the minimum within 24 hours of joining. Your rewards are worth the order value, split 50% coupons and 50% allowance, plus an extra 30% in credits.

  • Caps per order: $130 total, of which $30 credits, $50 allowance and $50 coupons, unless the page shows other amounts.
  • Coupons and allowance arrive automatically. Credits must be claimed by hand each day over 7 days in a row; anything unclaimed is forfeited.
  • Allowance only works on the promo page, lasts 2 hours, is one per order, and can't be combined with other offers.
  • Credits can't be cashed out and don't expire once claimed. PayPal cashback, where offered, may be reviewed and delayed.
  • After the first order you may be offered an upgrade to $100 total if you place a second qualifying order in time.
  • Any refund forfeits unclaimed rewards and claimed rewards you haven't used.
  • Items from third-party providers may carry shipping fees.
reward: Up to 100$ back on your order, split across allowances, credits and coupons
