summary: |-
  Earn Temu Coins from any Temu order and from daily check-ins on the promo page, then spend them there on free prizes or discounts.

  • Orders earn $0.10 in coins per $1 spent, up to $100 in coins a day. Tap Claim within 24 hours or they expire.
  • Check-ins pay coins, with bonuses for a streak. Missing a day resets the streak. Check-ins may also offer a free gift, which needs a qualifying order within 24 hours; a gift claimed in an earlier cycle can't be claimed again.
  • Coins expire 30 days after they're credited.
  • Prizes: spend coins to pick one, then order it within 24 hours, or it expires and the coins aren't refunded. One prize a day. Cancelling or returning the prize order refunds the coins.
  • Discounts: $1 off per 10 coins, at most $50 or 20% of the item's reference price. Can't be combined with other offers.
  • Coins can't be transferred, cashed out or used elsewhere. A refund can take back coins earned from that order.
  • Minimum orders and shipping fees apply. The promo runs until Temu ends it.
reward: Earn coins from orders + check-ins, spend them on free items or discounts
