  - t: It doesn't cover orders placed under promotions
    warn: true
  - t: If you refund or cancel the unlock order, the card is removed and Temu reserves the right to charge you for any amount you've already used from it.
    warn: true
  - t: If the order you use it on is refunded, you don't get the discount back.
