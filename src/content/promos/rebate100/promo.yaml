date: "2024-11-12"
summary: |-
  Buy the number of items the promo page asks for, from the promo page, before the timer ends. You get one of the coupon bundles shown on the page.

  • Each coupon's expiry and where it can be used only show up after you receive it. Temu's general coupon rules also apply.
  • Cancelling or refunding any item in the qualifying order takes all the coupons back.
  • Items not shipped by Temu may carry shipping fees.
reward: Several types of Coupon bundles, good and bad.
rules:
  - t: <b>tl;dr:</b> Buy items to get various coupon bundles
  - t: "Has two flavors: Bad version: Coupon bundle in return for purchasing x items in an order. Better version: Coupon bundle (with considerably better numbers) and a much lower minimum item order."
  - t: "Buy however many items the page says (seen: 1 or 2) before time runs out"
  - t: Tap the ? on the bundle first to see what you're actually getting
  - t: "The big number is misleading. It's mostly coupons like $50 off a $300+ order (seen: $50 off $300, $30 off $200, etc.)"
    warn: true
  - t: You won't see expiry dates or restrictions until after you get the coupons
    warn: true
  - t: 'After you qualify, it will nag you to place another order for a "boost" (seen: one more 2-item order for +$300). Same deal, tap the ⓘ first'
  - t: Whether the boost is worth it depends on the order minimums. $300 in coupons that need $140 to $420 orders is not $300
    warn: true
  - t: Boost coupons usually have a 7-day expiry (seen)
  - t: Refund anything in the order and all coupons are gone
    warn: true
