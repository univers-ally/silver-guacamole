date: "2026-03-08"
summary: |-
  Two ways to earn free items.

  Prizes (the farm)
  • Choose items, collect water by doing the tasks on the page, and water your crop. Reach the target before the time limit and the chosen items are free.
  • The water you can hold is capped. Unused water expires at the time limit, unless you've already claimed your prize, in which case it carries over to the next round.
  • A crop can need up to 100,000 units of water, and what farming pays declines within the range shown on the page.

  Gifts (the Clover-Bar)
  • Fill the bar with clovers from qualifying orders placed from the promo page to get selected free items.
  • Clovers per order are capped, orders must meet the minimum shown, and the total value of gifts may be capped. Orders also pay water.
  • Refunding an order removes the progress it added, or forfeits the gift if it's already been redeemed.

  Other games and tasks on the page can also pay water, under their own rules.
reward: Water a virtual farm to an impossible 100% and get 'free' items. Every app on the page is a way to get water, and orders occasionally give credits.
rules:
  - t: <b>tl;dr:</b> Pick prizes. Give up on the prizes. Water daily x30, check your order rewards for credits/water to claim, and ignore everything else unless you actually like the minigames.
  - t: A lawless wasteland.
    warn: true
  - t: <b>The FREE Prizes:</b> Give up on them. If you really want them, wait for the 'Claim it all Early!' promo to pop up.
  - t: <b>Water:</b> everything on the page is water. Tap the can to water the crop for 10g per single water.
  - t: There is a cap on how much water you can hold, and whatever is left expires when the main timer ends
    warn: true
  - t: <b>Harvests halve:</b> per the rules a crop can need up to 100,000 units of water and its value "declines within a range". In practice each harvest pays about half the last one.
    warn: true
  - t: The main timer runs about a month.
