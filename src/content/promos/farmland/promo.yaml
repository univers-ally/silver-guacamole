  - id: clover-bar
    name: Clover Bar
    blurb: Order from the page to fill a bar and get 3 free items
    icon: ./e52c3191.webp
    rewards:
      - Water
    summary: |-
      Pick three free items and fill the progress bar with clovers to get them. The three items' combined value is capped at $300.

      • Clovers and water come from qualifying orders placed from the promo page, over the minimum order value and within the time limit.
      • Each order earns clovers at the percentage of the order amount shown on the page, up to a cap per order.
      • The water each order earns follows the water rules, and has to be claimed separately within 3 days.
      • Cancelling an order takes back the rewards it earned.
    rules:
      - t: Pick 3 items and fill the bar with clovers by ordering from the page. The items unlock one at a time, and it usually gives you 965 to start.
      - t: The 3 items are capped at $300 total.
      - t: Clovers per order are capped ~26, so one big order won't cut it. Expect a lot of orders.
        warn: true
    images:
      - src: ./9e610918.webp
        caption: Two items unlocked, one to go
      - src: ./be56d44a.webp
        caption: Timer ran out, progress saved
