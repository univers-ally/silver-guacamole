name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the output
        run: |
          test -f site/index.html || { echo "site/index.html is missing"; exit 1; }
          test -s site/index.html || { echo "site/index.html is empty"; exit 1; }
          test -f site/CNAME || { echo "site/CNAME is missing -- the custom domain would drop"; exit 1; }
          test -d site/img || { echo "site/img is missing"; exit 1; }
          echo "site/ contains $(find site -type f | wc -l) files"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
